# Compose de produção — VPS + Cloudflare.
#
# Arquitetura:
#   Cloudflare Pages  →  web (estático)
#   Cloudflare Tunnel →  backend (nesta máquina)
#   Cloudflare R2     →  fotos
#   este compose      →  backend + Postgres
#
# Nenhuma porta é publicada na internet. O túnel abre uma conexão de
# dentro para fora, então o servidor pode ficar com o firewall fechado —
# só SSH precisa entrar.
#
# Uso:
#   cp .env.prod.example .env.prod   # e preencha
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: lixo_db_prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem `ports`: o banco só existe na rede interna do compose.
    # Publicar 5432 é um dos erros mais comuns e mais caros.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: lixo_api_prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    # Sem `ports`: quem alcança o backend é o túnel, pela rede interna.
    # Para depurar direto no servidor, use:
    #   docker compose -f docker-compose.prod.yml exec backend sh
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Ambiente comunitário isolado: outro banco e volume de fotos. O mesmo
  # túnel alcança este serviço pelo nome backend-beta:3000.
  backend-beta:
    build:
      context: ./backend
    container_name: lixo_api_beta
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${BETA_DB_NAME:-lixo_na_rua_beta}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${BETA_JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-7d}
      CORS_ORIGIN: https://lixonarua.brconsultorias.com
      STORAGE_DRIVER: local
    volumes:
      - beta_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: lixo_tunnel
    # --no-autoupdate: atualização automática reinicia o processo em
    # horário imprevisível. Atualize junto com o resto do deploy.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  beta_uploads:
